# Cloudflare Pages deploys main through its Git integration.
# This workflow validates changes; it does not deploy to GitHub Pages.
name: Validate site build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Check booking backend types
        run: npx --no-install tsc -p functions/tsconfig.json
      - name: Test booking backend
        run: node --test tests/booking.test.cjs
      - name: Build static site
        run: npm run build
